<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pixel Peeper Library</title>
  </head>
  <body>
    <header class="top">
      <a class="brand" href="#/">Pixel Peeper <span>Library</span></a>
      <button class="settings" data-action="settings">Settings</button>
    </header>
    <main id="app" aria-live="polite"></main>
    <div class="toast" role="status" hidden></div>
    <script type="module">
// Preview only: stand-ins for extension APIs, plus optional sample data (?seed).
window.chrome={runtime:{onMessage:{addListener(){}},openOptionsPage:async()=>alert('Settings opens the extension options page.'),getURL:p=>p}};
const {Store}=await import('../../packages/store/src/index.ts');
const {measureElement,pageInfo,patternName,captureTitle}=await import('../../packages/measure/src/index.ts');
if(new URLSearchParams(location.search).has('seed')){
  const store=new Store();
  const shot=(w,h,draw)=>{const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,w,h);draw(g);return {base64:c.toDataURL('image/jpeg',.85).split(',')[1],mediaType:'image/jpeg',width:w,height:h};};
  const pill=(label,bg,fg)=>shot(480,150,g=>{g.fillStyle=bg;g.beginPath();g.roundRect(20,25,440,100,50);g.fill();g.fillStyle=fg;g.font='600 40px system-ui';g.textAlign='center';g.fillText(label,240,90);});
  const card=(t)=>shot(520,360,g=>{g.strokeStyle='#ddd';g.lineWidth=2;g.beginPath();g.roundRect(10,10,500,340,24);g.stroke();g.fillStyle='#111';g.font='600 34px system-ui';g.fillText(t,44,80);g.fillStyle='#666';g.font='22px system-ui';g.fillText('Room to build something bigger.',44,125);g.fillStyle='#111';g.font='700 56px system-ui';g.fillText('$49',44,215);g.beginPath();g.roundRect(44,250,220,64,32);g.fill();g.fillStyle='#fff';g.font='600 22px system-ui';g.fillText('Choose plan',86,290);});
  const c=(id,text,evidence,extra={})=>({id,text,label:'inferred',evidence,...extra});
  const lesson=(head,role,tag)=>({version:2,scope:'element',headline:c('h',head,['color.background']),role:c('r','The main action here.',['structure.tag'],{title:role}),technique:c('t','It is the heaviest object in its region.',['color.background'],{tag}),works:[c('w','Repeats across the page, so it reads as one action.',['consistency.sameStyleCount'],{title:'Consistent pattern'})],watch:[],tradeoff:null,steal:[c('s','Give the main action the only dark fill in its region.',['color.background'])],laws:[],visualOnly:[],vocabulary:[{term:'Visual weight',meaning:'How strongly something pulls the eye.'}],rejected:[],modelInfo:{provider:'groq',model:'qwen/qwen3.8-27b'},rulesLibraryVersion:'0.1.0',createdAt:new Date().toISOString()});
  const mk=async(id,html,site,host,pageName,an,img,saved,note='')=>{document.body.insertAdjacentHTML('beforeend',`<div id="seed-${id}" style="position:absolute;left:-9999px">${html}</div>`);const el=document.querySelector(`#seed-${id} > *`);const facts=measureElement(el);const page={...pageInfo(document),host,siteName:site,pageName,url:`https://${host}/${pageName.toLowerCase()}`,favicon:null};const pattern=patternName(facts,'element',an?.role?.title);const at=new Date(Date.now()-Math.random()*4e8).toISOString();await store.put({id,createdAt:at,updatedAt:at,scope:'element',page,facts,analysis:an,pattern,title:captureTitle(pattern,page),titleSource:'auto',saved:false,savedAt:null,note,hasImage:!!img},img?{thumb:img,full:img}:undefined);if(saved)await store.save(id,{note});document.getElementById('seed-'+id).remove();};
  await mk('s1','<button style="background:#111;color:#fff;padding:14px 28px;border-radius:999px;font-size:16px;line-height:24px">Start free trial</button>','Stripe','stripe.com','Pricing',lesson('A single dark pill makes the trial the obvious next step.','Primary call-to-action','contrast'),pill('Start free trial','#111','#fff'),true,'Use for our onboarding CTA');
  await mk('s2','<div style="border:1px solid #ddd;border-radius:24px;padding:24px"><h3>Growth</h3><p>Room to build</p></div>','Stripe','stripe.com','Pricing',lesson('Containment and a big price make each plan easy to scan.','Pricing card','isolation'),card('Growth'),true);
  await mk('s3','<button style="background:#5e6ad2;color:#fff;padding:10px 18px;border-radius:8px;font-size:14px;line-height:20px">Get started</button>','Linear','linear.app','Home',lesson('Brand colour on a quiet page carries the emphasis.','Hero call-to-action','color'),pill('Get started','#5e6ad2','#fff'),true);
  await mk('s4','<a style="color:#999;font-size:11px">Terms</a>','Linear','linear.app','Home',null,null,false);
  location.replace(location.pathname);
}
await import('../../apps/extension/entrypoints/library/main.ts');
</script>
  </body>
</html>
