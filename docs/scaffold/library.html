<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pixel Peeper Library</title>
  </head>
  <body>
    <header class="top">
      <a class="brand" href="#/">Pixel Peeper <span>Library</span></a>
      <button class="settings" data-action="settings">Settings</button>
    </header>
    <main id="app" aria-live="polite"></main>
    <div class="toast" role="status" hidden></div>
    <script type="module">
// Preview only: stand-ins for extension APIs, plus optional sample data (?seed).
window.chrome={
  runtime:{id:'preview',onMessage:{addListener(){}},openOptionsPage:async()=>alert('Settings opens the extension options page.'),getURL:p=>p,
    // Fake AI replies for Compare (the real ones come from the background worker).
    sendMessage:async m=>{ if(m.type!=='pp:compare') return {ok:true}; await new Promise(r=>setTimeout(r,900));
      const c=(id,title,text,evidence,tag)=>({id,title,text,label:'inferred',evidence,...(tag?{tag}:{})});
      return m.mode==='readAcross'
        ? {insight:{kind:'readAcross',claims:[c('k1','Container versus action','A frames a whole plan with a border and generous padding, while B is a single filled action with no frame.',['A:shape.borderWidth','A:spacing.padding','B:color.background']),c('k2','Where the weight sits','In A the large price carries the weight; in B the dark fill does.',['A:typography.fontSize','B:color.contrast'])],bestFor:[c('b1','comparing plans side by side','A’s frame groups price and action as one choice.',['A:shape.borderRadius'],'A'),c('b2','one obvious next step','B’s fill makes it the heaviest object around it.',['B:color.background'],'B')],rejected:[{text:'x',reason:'States unmeasured number(s): 52'}],modelInfo:{provider:'groq',model:'qwen/qwen3.8-27b'},createdAt:new Date().toISOString()}}
        : {insight:{kind:'rationale',claims:[c('r1','Calm frame, loud action','A’s bordered card gives structure while B’s dark fill keeps the action obvious.',['A:shape.borderWidth','B:color.background'])],bestFor:[],rejected:[],modelInfo:{provider:'groq',model:'qwen/qwen3.8-27b'},createdAt:new Date().toISOString()}};
    }},
  storage:{local:{get:async()=>({'pixelpeeper.settings':{provider:'groq',keys:{groq:'preview'},models:{}}}),set:async()=>{},remove:async()=>{}}},
};
const {Store}=await import('../../packages/store/src/index.ts');
const {measureElement,pageInfo,patternName,captureTitle}=await import('../../packages/measure/src/index.ts');
if(new URLSearchParams(location.search).has('seed')){
  const store=new Store();
  const {measureLayout}=await import('../../packages/measure/src/index.ts');
  /** Draw a laid-out element to a canvas (backgrounds, borders, text) so the preview screenshot matches its measured layout. */
  const snapshot=el=>{const R=el.getBoundingClientRect(),dpr=2,c=document.createElement('canvas');c.width=R.width*dpr;c.height=R.height*dpr;const g=c.getContext('2d');g.scale(dpr,dpr);g.fillStyle='#fff';g.fillRect(0,0,R.width,R.height);
    for(const n of [el,...el.querySelectorAll('*')]){const r=n.getBoundingClientRect(),cs=getComputedStyle(n),x=r.left-R.left,y=r.top-R.top,rad=parseFloat(cs.borderTopLeftRadius)||0;
      if(cs.backgroundColor!=='rgba(0, 0, 0, 0)'){g.fillStyle=cs.backgroundColor;g.beginPath();g.roundRect(x,y,r.width,r.height,Math.min(rad,r.height/2));g.fill();}
      if(parseFloat(cs.borderTopWidth)>0){g.strokeStyle=cs.borderTopColor;g.lineWidth=parseFloat(cs.borderTopWidth);g.beginPath();g.roundRect(x+.5,y+.5,r.width-1,r.height-1,rad);g.stroke();}
      const own=[...n.childNodes].filter(t=>t.nodeType===3&&t.textContent.trim());if(own.length){const range=document.createRange();range.selectNodeContents(n);const tr=range.getBoundingClientRect();g.fillStyle=cs.color;g.font=`${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;g.textBaseline='middle';g.fillText(own.map(t=>t.textContent.trim()).join(' '),tr.left-R.left,tr.top-R.top+tr.height/2);}}
    return {base64:c.toDataURL('image/jpeg',.9).split(',')[1],mediaType:'image/jpeg',width:c.width,height:c.height};};
  const c=(id,text,evidence,extra={})=>({id,text,label:'inferred',evidence,...extra});
  const lesson=(head,role,tag,extra={})=>({version:2,scope:'element',headline:c('h',head,['color.background']),role:c('r','The main action here.',['structure.tag'],{title:role}),technique:c('t','It is the heaviest object in its region.',['color.background'],{tag}),works:[c('w','Generous padding gives the content room and groups it as one card.',['spacing.padding'],{title:'Room to breathe'}),c('w2','A large price is read first, before the description.',['typography.fontSize'],{title:'Price leads'})],watch:[c('x','The fine print is too faint to read comfortably.',['color.contrast'],{title:'Faint fine print'})],tradeoff:null,steal:[c('s','Give the main action the only dark fill in its region.',['color.background'])],laws:[c('l','A wide, tall target is quick to reach.',['a11y.tapTarget'],{ruleId:'law-fitts',tag:'supports'})],visualOnly:[],vocabulary:[{term:'Visual weight',meaning:'How strongly something pulls the eye.'}],rejected:[],modelInfo:{provider:'groq',model:'qwen/qwen3.8-27b'},rulesLibraryVersion:'0.1.0',createdAt:new Date().toISOString(),...extra});
  const mk=async(id,html,site,host,pageName,an,saved,note='',shot=true)=>{const holder=document.createElement('div');holder.style.cssText='position:absolute;left:-3000px;top:0';holder.innerHTML=html;document.body.append(holder);const el=holder.firstElementChild;const facts=measureElement(el);const R=el.getBoundingClientRect();const frame={x:R.left,y:R.top,width:R.width,height:R.height};const annotations=shot?measureLayout(el,frame,'element'):null;const img=shot?snapshot(el):null;
    const page={...pageInfo(document),host,siteName:site,pageName,url:`https://${host}/${pageName.toLowerCase()}`,favicon:null};const pattern=patternName(facts,'element',an?.role?.title);const at=new Date(Date.now()-Math.random()*4e8).toISOString();
    await store.put({id,createdAt:at,updatedAt:at,scope:'element',page,facts,analysis:an,pattern,title:captureTitle(pattern,page),titleSource:'auto',saved:false,savedAt:null,note,hasImage:!!img,annotations},img?{thumb:img,full:img}:undefined);if(saved)await store.save(id,{note});holder.remove();};
  const font='font-family:-apple-system,system-ui,sans-serif';
  await mk('s2',`<div style="width:340px;box-sizing:border-box;border:1px solid #ddd;border-radius:20px;padding:28px;background:#fff;${font}"><h3 style="margin:0 0 8px;font-size:22px;font-weight:600;line-height:28px;color:#111">Growth</h3><p style="margin:0 0 16px;font-size:15px;line-height:22px;color:#555">Room to build something bigger.</p><div style="margin:0 0 20px;font-size:44px;font-weight:700;line-height:48px;color:#111">$49</div><button style="display:block;border:0;border-radius:999px;background:#111;color:#fff;font-size:15px;font-weight:600;line-height:20px;padding:14px 28px;${font}">Choose plan</button><p style="margin:14px 0 0;font-size:11px;line-height:16px;color:#c2c2c2">Billed yearly. Taxes extra.</p><a href="#" style="display:inline-block;margin-top:6px;font-size:11px;line-height:16px;color:#777">Terms</a></div>`,'Stripe','stripe.com','Pricing',lesson('Containment and a big price make each plan easy to scan.','Pricing card','isolation'),true,'Use for our plans page');
  await mk('s1',`<button style="border:0;border-radius:999px;background:#111;color:#fff;font-size:16px;font-weight:600;line-height:24px;padding:14px 28px;${font}">Start free trial</button>`,'Stripe','stripe.com','Pricing',lesson('A single dark pill makes the trial the obvious next step.','Primary call-to-action','contrast'),true);
  await mk('s3',`<button style="border:0;border-radius:8px;background:#5e6ad2;color:#fff;font-size:14px;font-weight:500;line-height:20px;padding:10px 18px;${font}">Get started</button>`,'Linear','linear.app','Home',lesson('Brand colour on a quiet page carries the emphasis.','Hero call-to-action','color'),true);
  await mk('s4','<a href="#" style="color:#999;font-size:11px">Terms</a>','Linear','linear.app','Home',null,false,'',false);
  location.replace(location.pathname);
}
await import('../../apps/extension/entrypoints/library/main.ts');
</script>
  </body>
</html>
